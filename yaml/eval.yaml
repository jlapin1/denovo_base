# Number of batches in loader is set in config.yaml:loader
eval_only:
  eval_dataset_path: /cmnfs/data/proteomics/foundational_model/inference # None: use config.yaml setting, else: override
  eval_name: barley
  custom_columns:
    - 'file_index'
    - 'scan'
  set: test # key name in D.data.dataloader/dataset
  max_batches:
  save: True
  stream: True
  outpath: ./inference_barley.parquet
  # diffusion only
  clamp_denoised: # None -> use existing setting in loaded yaml
  n: 1 # None -> use existing
eval_train: 
  set: val
