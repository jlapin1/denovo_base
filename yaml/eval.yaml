# Number of batches in loader is set in config.yaml:loader
eval_only:
  eval_dataset_path: /cmnfs/data/proteomics/foundational_model/kingdoms # None: use config.yaml setting, else: override
  eval_name: cerevisiae # string to match for eval filename
  set: test # key name in D.data.dataloader/dataset
  val_steps: 
  disperse: False
  save: True
  stream: True
  outpath: ./mkb2_kngyeast_ar.parquet
  # diffusion only
  clamp_denoised: # None -> use existing setting in loaded yaml
  n: 1 # None -> use existing
  loader_custom_columns:
  eval_kwargs:
    #num_steps: 20
    #save_x: True
    #save_p: True
  inference_save_keys:
    - experiment_name
    - file_index
    - scan
    - length
    - charge
    - mass
    - aa_prob_min
    - pep_prob_min
eval_train: 
  set: val
